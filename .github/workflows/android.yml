name: Build JARVIS Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            echo "APK build attempt $attempt of 5"
            if gradle --no-daemon assembleDebug; then
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then
              echo "Build failed; retrying after 15 seconds."
              sleep 15
            fi
          done
          exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
